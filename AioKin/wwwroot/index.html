<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AioKin — Đăng nhập SSO</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --card-inner: #0F172A;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --border-color: #334155;
      --success: #10B981;
      --error: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .logo-badge {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #6366F1 0%, #A855F7 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }

    .logo-badge svg {
      width: 36px;
      height: 36px;
      fill: #FFFFFF;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-google {
      background-color: #FFFFFF;
      color: #1F2937;
    }

    .btn-google:hover, .btn-google:active {
      background-color: #F3F4F6;
      transform: translateY(-1px);
    }

    .btn-facebook {
      background-color: #1877F2;
      color: #FFFFFF;
    }

    .btn-facebook:hover, .btn-facebook:active {
      background-color: #166FE5;
      transform: translateY(-1px);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .options-box {
      margin-top: 20px;
      padding: 12px 14px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      text-align: left;
      font-size: 13px;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .option-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .loading-overlay {
      display: none;
      margin-top: 20px;
      font-size: 14px;
      color: #818CF8;
      line-height: 1.6;
    }

    .user-card {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      text-align: left;
    }

    .user-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #334155;
      object-fit: cover;
    }

    .user-meta h3 {
      font-size: 16px;
      color: var(--text-main);
    }

    .user-meta p {
      font-size: 13px;
      color: var(--text-sub);
    }

    .token-box {
      background: #000000;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      color: #A7F3D0;
      word-break: break-all;
      max-height: 90px;
      overflow-y: auto;
      margin-top: 10px;
    }

    .btn-action-small {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>

    <h1>Chào mừng đến AioKin</h1>
    <p class="subtitle">Đăng nhập tài khoản nhanh chóng để đồng bộ PromptVault và kết nối gia đình.</p>

    <div class="btn-group" id="loginButtons">
      <!-- Google Login Button -->
      <button type="button" class="btn btn-google" id="googleBtn" onclick="initiateLogin('google')">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Tiếp tục với Google
      </button>

      <!-- Facebook Login Button -->
      <button type="button" class="btn btn-facebook" id="facebookBtn" onclick="initiateLogin('facebook')">
        <svg viewBox="0 0 24 24" fill="#FFFFFF">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        Tiếp tục với Facebook
      </button>
    </div>

    <!-- Tuy chon dang nhap SSO -->
    <div class="options-box" id="optionsBox">
      <label class="option-item">
        <input type="checkbox" id="forcePromptCheck" checked>
        <span>Mở popup chọn tài khoản (<code>prompt=select_account</code>)</span>
      </label>
      <label class="option-item" id="popupOptionItem">
        <input type="checkbox" id="usePopupCheck" checked>
        <span>Mở qua cửa sổ Popup (thay vì chuyển trang)</span>
      </label>
    </div>

    <div class="loading-overlay" id="loadingText"></div>

    <!-- Khung hien thi sau khi dang nhap thanh cong -->
    <div class="user-card" id="userCard">
      <div class="user-card-header">
        <img class="user-avatar" id="userAvatar" src="" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?background=6366F1&color=fff&name=User'">
        <div class="user-meta">
          <h3 id="userName">Họ và tên</h3>
          <p id="userEmail">user@example.com</p>
        </div>
      </div>
      <div style="font-size: 12px; color: var(--success); font-weight: 600;">✓ Đăng nhập thành công</div>
      <div class="token-box" id="tokenBox">Token</div>
      <button type="button" class="btn-action-small" onclick="copyToken()">Sao chép Access Token</button>
      <button type="button" class="btn-action-small" style="background:#475569;margin-left:8px;" onclick="resetLogin()">Đăng nhập lại</button>
    </div>

    <div class="footer-note">
      Bằng việc đăng nhập, bạn đồng ý với Điều khoản sử dụng và Chính sách bảo mật của AioKin.
    </div>
  </div>

  <script>
    const isReactNative = !!(window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function');

    // Neu dang chay trong React Native WebView, mac dinh khong mo bang window.open popup ma direct trong WebView
    if (isReactNative) {
      document.getElementById('usePopupCheck').checked = false;
      document.getElementById('popupOptionItem').style.opacity = '0.6';
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'LOGIN_WEBVIEW_READY' }));
    }

    function initiateLogin(provider) {
      const forcePrompt = document.getElementById('forcePromptCheck').checked;
      const usePopup = document.getElementById('usePopupCheck').checked;

      let url = '/auth/login/' + provider;
      const params = [];
      if (forcePrompt) {
        if (provider === 'google') params.push('prompt=select_account');
        if (provider === 'facebook') params.push('authType=reauthenticate');
      }
      if (params.length > 0) {
        url += '?' + params.join('&');
      }

      const providerName = provider === 'google' ? 'Google' : 'Facebook';

      if (usePopup && !isReactNative) {
        const w = 520, h = 680;
        const left = window.screenX + (window.outerWidth - w) / 2;
        const top = window.screenY + (window.outerHeight - h) / 2;
        const popup = window.open(url, 'oauth_popup', `width=${w},height=${h},left=${left},top=${top},scrollbars=yes,status=no`);

        if (!popup || popup.closed || typeof popup.closed === 'undefined') {
          // Trinh duyet chan popup -> tu dong chuyen sang chuyen trang truc tiep
          showLoading('Trình duyệt đã chặn popup. Đang chuyển hướng trực tiếp...');
          window.location.href = url;
        } else {
          popup.focus();
          showLoading('Đang chờ bạn chọn tài khoản và xác thực trong cửa sổ popup ' + providerName + '...');
        }
      } else {
        showLoading('Đang chuyển hướng tới ' + providerName + ' để chọn tài khoản...');
        window.location.href = url;
      }
    }

    function showLoading(msg) {
      const el = document.getElementById('loadingText');
      el.style.display = 'block';
      el.innerText = msg;
    }

    function handleAuthSuccess(payload) {
      document.getElementById('loadingText').style.display = 'none';
      document.getElementById('loginButtons').style.display = 'none';
      document.getElementById('optionsBox').style.display = 'none';

      const userCard = document.getElementById('userCard');
      userCard.style.display = 'block';

      const u = payload.user || {};
      document.getElementById('userName').innerText = u.fullName || u.displayName || u.username || 'Người dùng AioKin';
      document.getElementById('userEmail').innerText = u.email || payload.email || 'Email đã xác thực';
      if (u.avatar) {
        document.getElementById('userAvatar').src = u.avatar;
      }

      document.getElementById('tokenBox').innerText = payload.accessToken || '(Không có token)';

      // Gui cho React Native WebView neu dang nhung trong App
      if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
        window.ReactNativeWebView.postMessage(JSON.stringify(payload));
      }
    }

    function resetLogin() {
      document.getElementById('userCard').style.display = 'none';
      document.getElementById('loginButtons').style.display = 'flex';
      document.getElementById('optionsBox').style.display = 'flex';
      document.getElementById('loadingText').style.display = 'none';
      window.location.hash = '';
    }

    function copyToken() {
      const token = document.getElementById('tokenBox').innerText;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(token).then(() => alert('Đã sao chép Access Token vào clipboard!'));
      } else {
        alert('Đã chọn token, hãy copy bằng tay: ' + token);
      }
    }

    // 1. Lang nghe postMessage tu cua so popup OAuth
    window.addEventListener('message', function (event) {
      const data = event.data;
      if (!data) return;

      const payload = typeof data === 'string' ? safeJsonParse(data) : data;
      if (!payload) return;

      if (payload.type === 'GOOGLE_LOGIN_SUCCESS' || payload.type === 'FACEBOOK_LOGIN_SUCCESS') {
        handleAuthSuccess(payload);
      } else if (payload.type === 'GOOGLE_LOGIN_ERROR' || payload.type === 'FACEBOOK_LOGIN_ERROR') {
        showLoading('Đăng nhập thất bại: ' + (payload.error || 'Lỗi không xác định'));
      }
    });

    // 2. Kiem tra xem co phai redirect fallback qua hash tren URL khong (#auth=...)
    window.addEventListener('DOMContentLoaded', function () {
      if (window.location.hash) {
        const hash = window.location.hash.substring(1);
        if (hash.startsWith('auth=')) {
          try {
            const jsonStr = decodeURIComponent(hash.substring(5));
            const payload = JSON.parse(jsonStr);
            if (payload.accessToken) {
              handleAuthSuccess(payload);
            }
          } catch (e) {
            console.error('Loi parse auth hash:', e);
          }
        } else if (hash.startsWith('error=')) {
          showLoading('Đăng nhập thất bại: ' + decodeURIComponent(hash.substring(6)));
        }
      }
    });

    function safeJsonParse(str) {
      try { return JSON.parse(str); } catch (e) { return null; }
    }
  </script>
</body>
</html>
